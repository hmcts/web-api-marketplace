name: CI Checks

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      # Install before `yarn run`: with the node-modules linker Yarn needs the install
      # state to resolve a script, and `cichecks` cannot install itself into existence.
      - run: yarn install --immutable
      - run: yarn cichecks
