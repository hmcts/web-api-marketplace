# Runs web's Playwright journeys against web and service started together on the runner, so a
# change to either that breaks the other fails its PR. A web PR runs against service master;
# service-api-marketplace calls this workflow so a service PR runs against web master.
name: Stack journeys

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      web-ref:
        type: string
        default: master
      service-ref:
        type: string
        default: master
  workflow_call:
    inputs:
      web-ref:
        type: string
        default: master
      service-ref:
        type: string
        default: master

permissions:
  contents: read

env:
  ENTRA_TENANT: 00000000-0000-4000-8000-00000000c1a0

jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marketplace"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      # Named explicitly, as a calling workflow's repository would otherwise be checked out
      - name: Check out web
        uses: actions/checkout@v7
        with:
          repository: hmcts/web-api-marketplace
          ref: ${{ inputs.web-ref || github.event.pull_request.head.sha || github.sha }}
          path: web

      - name: Check out service
        uses: actions/checkout@v7
        with:
          repository: hmcts/service-api-marketplace
          ref: ${{ inputs.service-ref || 'master' }}
          path: service

      - name: Start the Entra mock
        run: |
          docker run --detach --name entra-mock --publish 4600:4600 \
            --env SERVER_PORT=4600 --env JSON_CONFIG_PATH=/config/entra-mock.json \
            --volume "$PWD/web/docker/entra-mock.json:/config/entra-mock.json:ro" \
            ghcr.io/navikt/mock-oauth2-server:6.0.3

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'
          cache-dependency-path: service/*.gradle*

      - name: Start service
        working-directory: service
        env:
          ENTRA_BYPASS: 'true'
        run: |
          ./gradlew --no-daemon bootJar
          nohup java -jar build/libs/amp-marketplace.jar > ../service.log 2>&1 &

      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc

      - name: Start web
        working-directory: web
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PORT: '3344'
          API_URL: http://localhost:8080
          SESSION_SECRET: stack-journeys-session-secret
          ENTRA_CLIENT_ID: local-web-api-marketplace
          ENTRA_CLIENT_SECRET: local-mock-only
          ENTRA_TENANT_ID: ${{ env.ENTRA_TENANT }}
          ENTRA_AUTHORIZE_ENDPOINT: http://localhost:4600/${{ env.ENTRA_TENANT }}/authorize
          ENTRA_TOKEN_ENDPOINT: http://localhost:4600/${{ env.ENTRA_TENANT }}/token
          ENTRA_DISCOVERY_ENDPOINT: http://localhost:4600/${{ env.ENTRA_TENANT }}/.well-known/openid-configuration
          ENTRA_REDIRECT_URI: http://localhost:3344/auth/callback
          ENTRA_POST_LOGOUT_REDIRECT_URI: http://localhost:3344/
        run: |
          corepack enable
          yarn install --immutable
          yarn build:prod
          nohup yarn start > ../web.log 2>&1 &

      - name: Wait for service and web
        run: |
          wait_for () {
            for _ in $(seq 1 60); do
              curl -fsS -o /dev/null "$1" && { echo "$1 is up"; return 0; }
              sleep 5
            done
            echo "$1 did not come up within 5 minutes" >&2
            return 1
          }
          wait_for http://localhost:8080/health/readiness
          wait_for http://localhost:3344/

      - name: Run the journeys
        working-directory: web
        env:
          TEST_URL: http://localhost:3344
          PLAYWRIGHT_REPORTERS: list,html
        run: |
          yarn playwright install --with-deps chrome
          yarn playwright test --project=chrome

      - name: Show the app logs
        if: failure()
        run: |
          echo '::group::service' && cat service.log && echo '::endgroup::'
          echo '::group::web' && cat web.log && echo '::endgroup::'

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: stack-journeys-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
